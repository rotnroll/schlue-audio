<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07120f">
    <meta name="description" content="Contact Schlue Audio with questions, suggestions, bug reports, or feedback.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rotnroll.github.io/schlue-audio/contact/">
    <meta property="og:title" content="Contact — Schlue Audio">
    <meta property="og:description" content="Questions, suggestions, bug reports, or feedback for Schlue Audio.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Contact — Schlue Audio">
    <meta name="twitter:description" content="Questions, suggestions, bug reports, or feedback for Schlue Audio.">
    <link rel="canonical" href="https://rotnroll.github.io/schlue-audio/contact/">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <title>Contact — Schlue Audio</title>
    <link rel="stylesheet" href="../assets/site.css">
  </head>
  <body class="contact-page">
    <header class="site-header">
      <a class="brand" href="../" aria-label="Schlue Audio home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>SCHLUE</span>
        <span class="brand-sub">AUDIO</span>
      </a>
      <a class="back-link" href="../">All plug-ins</a>
    </header>

    <main>
      <section class="contact-section" aria-labelledby="contact-title">
        <h1 id="contact-title">Contact</h1>
        <p class="contact-note">Questions, suggestions, bug reports, feedback? Let me know!</p>
        <form class="contact-form" action="https://submit-form.com/O4KWFPYny">
          <div class="form-grid">
            <div class="form-field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Name" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
            </div>
          </div>
          <div class="form-field">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Message" rows="7" required></textarea>
          </div>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
  </body>
</html>

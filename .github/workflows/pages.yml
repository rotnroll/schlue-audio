name: Deploy download website

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'release' && 'pages-refresh' || 'pages-deploy' }}
  cancel-in-progress: true

jobs:
  refresh-on-release:
    name: Request main-branch Pages refresh
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Pages workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo rotnroll/schlue-audio --ref main

  build:
    name: Validate and assemble website
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v5

      - name: Test catalog generation
        run: python -m unittest discover -s tests -v

      - name: Assemble static website
        run: python scripts/build-site.py . _site

      - name: Generate Release-backed download catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate-download-index.py . --output _site/downloads.json

      - name: Validate website and download links
        run: python scripts/validate-site.py . --site-root _site --catalog _site/downloads.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
